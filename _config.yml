A loom is a tool, not a product. It's the apparatus on which work gets made. The threads coming off it can be anything — a piece by one editor, a conversation between two, a workshop document, a guest reflection, an opening question.

We wanted a space adjacent to the press, slightly less formal than a publication, slightly more public than a notebook. Somewhere to think aloud. Somewhere to write with each other and with people we admire. Somewhere to leave a record of what came up in a reading club, what got written on the butcher paper, what the workshop made possible.

So: The Loom.

It will be uneven. Some weeks there will be a piece; some weeks there won't. Some pieces will be quick — a writing prompt, a found object, a note from the editorial desk. Some will be longer — an essay, a conversation transcribed and lightly edited, a series of letters between two writers thinking through the same question.

What we hope for it is what we hope for everything the press does: that it stays close to the work, that it makes room for voices we haven't heard from yet, that it remembers writing is a practice you do *with* people, not at them.

If you are a co-editor reading this: write something. Anything. A single paragraph that begins with the word *because*. A list of questions you've been carrying around. A prompt you want to answer with us. The loom is ready.

If you are a reader reading this: welcome. We are glad you are here. Stay close, and you'll see what comes off the loom in the months ahead.
